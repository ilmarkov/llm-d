topology: aggregated
model:
  id: RedHatAI/GLM-5.3-NVFP4
  label: glm-5.3-nvfp4
  image_ref: vllm.nightly_2026-11-16
  served_name: RedHatAI/GLM-5.3-NVFP4
  image: quay.io/rh-ee-imarkov/vllm-openai:nightly-9bc16ae6a34b1e0fe260e8d12b98568478bf38c3-eplb-stats-arm64
routing:
  kind: load_aware
  target_role: decode
  precise_prefix_cache: true
  precise_prefix_cache_affinity_threshold: 0.8
  precise_prefix_cache_peak_prefill_throughput: 23000
  precise_prefix_cache_max_ttft_penalty_ms: 4783
runtime:
  env:
    VLLM_SERVER_DEV_MODE: '1'
  sidecars:
  - dcgm-exporter
  - node-exporter
  pre_launch:
  - uv pip install --system nvshmem4py-cu13==0.4.0
  - "python3 -c \"import nixl\" 2>/dev/null || pip install -q \\\n  'nixl==1.4.1'\
    \ 'cupy-cuda13x!=14.1.0'\n"
  - "NCCL_RAW=$(python3 -c \"\nimport ctypes\nfrom vllm.utils.nccl import find_nccl_library\n\
    lib = ctypes.CDLL(find_nccl_library())\nv = ctypes.c_int(); lib.ncclGetVersion(ctypes.byref(v))\n\
    print(v.value)\" 2>/dev/null || echo 0)\nif [ \"$NCCL_RAW\" -lt 23004 ]; then\n\
    \  pip install -q 'nvidia-nccl-cu13>=2.30.4'\n  NCCL_LIB=$(python3 -c \"from vllm.utils.nccl\
    \ import find_nccl_library_paths as f; print(f()[0])\")\n  export LD_LIBRARY_PATH=\"\
    ${NCCL_LIB}:${LD_LIBRARY_PATH:-}\"\n  echo \"NCCL upgraded: ${NCCL_LIB} (was raw\
    \ version ${NCCL_RAW})\"\nfi\n"
vars:
  max_concurrency: 64
roles:
- name: decode
  workload_name: glm53-eplb-agg-dep16-stats-only-decode
  lws:
    size: 4
    replicas: 1
  parallelism:
    tp: 1
    dp: 16
    ep: true
  dp_load_balancing: external
  fabric_profile: megamoe
  kv_transfer_config:
    kv_connector: OffloadingConnector
    kv_role: kv_both
    kv_connector_extra_config:
      spec_name: TieringOffloadingSpec
      cpu_bytes_to_use: 107374182400
      eviction_policy: lru
      offload_prompt_only: true
      self_describing_kv_events: true
      secondary_tiers:
      - type: p2p
        host: __POD_IP__
        port: __P2P_PORT__
        backends:
        - UCX
        num_threads: 4
  p2p_config:
    port: 7777
  shm_size: 640Gi
  env:
    PYTHONHASHSEED: '0'
    VLLM_USE_RUST_FRONTEND: '1'
    VLLM_USE_V2_MODEL_RUNNER: '1'
    KV_OFFLOAD_CPU_BYTES: '107374182400'
    VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '120'
    VLLM_RANDOMIZE_DP_DUMMY_INPUTS: '1'
    VLLM_USE_DEEP_GEMM: '1'
    VLLM_USE_NCCL_SYMM_MEM: '1'
    VLLM_ENGINE_READY_TIMEOUT_S: '3600'
    VLLM_RPC_TIMEOUT: '600000'
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
    TILELANG_CLEANUP_TEMP_FILES: '1'
    FLASH_ATTENTION_CUTE_DSL_CACHE_ENABLED: '0'
    DG_JIT_CACHE_DIR: /tmp/dg-cache-glm53-mxfp4
    UCX_TLS: cuda_copy,cuda_ipc,rc
    UCX_CUDA_IPC_ENABLE_MNNVL: y
    VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '0'
  resources:
    memory: 800Gi
    ephemeral_storage: 256Gi
  vllm:
    load_format: auto
    disable_uvicorn_access_log: true
    trust_remote_code: true
    enable_cumem_allocator: true
    enable_ep_weight_filter: true
    no_disable_hybrid_kv_cache_manager: true
    no_enable_flashinfer_autotune: true
    moe_backend: flashinfer_moe_ep_cutedsl
    kv_cache_dtype: fp8
    enable_scale_out: true
    max_model_len: auto
    disable_access_log_for_endpoints: /health,/metrics
    reasoning_parser: glm47
    tool_call_parser: glm47
    enable_auto_tool_choice: true
    numa_bind: true
    gpu_memory_utilization: '0.87'
    block_size: 64
    max_num_seqs: 64
    max_num_batched_tokens: 8192
    max_cudagraph_capture_size: 64
    compilation_config:
      cudagraph_mode: FULL_DECODE_ONLY
      mode: 0
    kv_cache_metrics: true
    kv_cache_metrics_sample: 0.25
    kv_cache_memory: 78431976704
    speculative_config:
      method: dspark
      model: RedHatAI/GLM-5.3-speculator.dspark
      num_speculative_tokens: 5
      enable_adaptive_verification: true
      draft_sample_method: probabilistic
    enable_eplb: true
    eplb_config:
      num_redundant_experts: 0
      use_async: true
      policy: default
      window_size: 100
      step_interval: 1000
      communicator: nixl
      log_balancedness: true
      stats_only: true
      log_balancedness_interval: 1000
      expert_load_dump_dir: /mnt/lustre/ilmarkov-2/eplb-research/glm53-agg-dep16-stats-only/eplb-jsonl
      expert_load_dump_interval: 1000
  pre_launch:
  - '# PATCHING DISABLED: apply_cutlass_mxfp4_topk_int32_fix.py, apply_speculative_ep_fix.py

    # PATCH_DIR="$(dirname "$(dirname "$LOG_DIR")")/dspark_patches"

    # test -f "$PATCH_DIR/apply_speculative_ep_fix.py"

    # python3 "$PATCH_DIR/apply_speculative_ep_fix.py"

    # test -f "$PATCH_DIR/apply_cutlass_mxfp4_topk_int32_fix.py"

    # python3 "$PATCH_DIR/apply_cutlass_mxfp4_topk_int32_fix.py"'
release: glm53-eplb-agg-dep16-stats-only
